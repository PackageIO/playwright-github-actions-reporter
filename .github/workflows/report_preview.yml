name: Reporter preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build reporter
        run: npm run build

      - name: Run report preview examples
        continue-on-error: true
        run: npx playwright test --config=playwright.example.config.ts

      - name: Verify report includes all outcome types
        run: grep -Fq 'All: 4 | Passed: 1 | Failed: 1 | Flaky: 1 | Skipped: 1' "$GITHUB_STEP_SUMMARY"